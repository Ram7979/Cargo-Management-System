<div class="auth-container">
  <mat-card class="auth-card">
    <div class="auth-header">
      <mat-icon color="primary" class="logo">lock_reset</mat-icon>
      <h2>Reset Password</h2>
      <p *ngIf="!isSent">Enter your email to receive a reset link</p>
    </div>

    <div *ngIf="isSent" class="success-message">
      <mat-icon color="primary">mark_email_read</mat-icon>
      <p>If an account exists for <b>{{ forgotForm.value.email }}</b>, you will receive a password reset link shortly.</p>
      <button mat-stroked-button color="primary" class="full-width mt-3" routerLink="/auth/login">Back to Login</button>
    </div>

    <form *ngIf="!isSent" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email Address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="Enter your registered email">
        <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="full-width auth-btn" type="submit" [disabled]="forgotForm.invalid || isLoading">
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
        <span *ngIf="!isLoading">Send Reset Link</span>
      </button>

      <div class="auth-footer">
        <a routerLink="/auth/login">Remembered your password? Login here.</a>
      </div>
    </form>
  </mat-card>
</div>
