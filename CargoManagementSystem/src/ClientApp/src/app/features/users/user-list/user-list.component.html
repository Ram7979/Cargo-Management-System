<div class="page-header">
  <h2>User Management</h2>
  <div class="header-actions">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search users...</mat-label>
      <input matInput [(ngModel)]="searchQuery" (keyup.enter)="onSearch()">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon> Add User
    </button>
  </div>
</div>

<div class="card-container">
  <table mat-table [dataSource]="dataSource" class="w-100">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user"> 
        <div class="user-cell">
          <div class="avatar-sm">{{ user.firstName[0] }}{{ user.lastName[0] }}</div>
          <span>{{ user.firstName }} {{ user.lastName }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
    </ng-container>

    <ng-container matColumnDef="roles">
      <th mat-header-cell *matHeaderCellDef>Roles</th>
      <td mat-cell *matCellDef="let user">
        <mat-chip-set>
          <mat-chip *ngFor="let role of user.roles" [color]="getRoleColor(role)" selected>
            {{ role }}
          </mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let user">
        <span class="status-chip" [ngClass]="user.isActive ? 'active' : 'inactive'">
          {{ user.isActive ? 'Active' : 'Deactivated' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button color="primary" [routerLink]="['/users', user.userId]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button [color]="user.isActive ? 'warn' : 'primary'" (click)="toggleUserStatus(user)">
          <mat-icon>{{ user.isActive ? 'block' : 'check_circle' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="totalItems"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 20]"
                 (page)="onPageChange($event)">
  </mat-paginator>
</div>
