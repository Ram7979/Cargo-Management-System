<div class="page-header">
  <h2>My Profile</h2>
</div>

<div class="profile-container" *ngIf="authService.currentUser() as user">
  <mat-card class="profile-card">
    <div class="avatar-section">
      <div class="avatar-xl">{{ initials }}</div>
      <div class="user-meta">
        <h3>{{ user.firstName }} {{ user.lastName }}</h3>
        <p class="email">{{ user.email }}</p>
        <div class="roles">
          <mat-chip *ngFor="let role of user.roles" color="primary" selected>{{ role }}</mat-chip>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <mat-card-content>
      <h4>Edit Profile</h4>
      <form [formGroup]="form" class="edit-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName">
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName">
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email (read-only)</mat-label>
          <input matInput [value]="user.email" readonly>
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-flat-button color="primary" [disabled]="isSaving || form.invalid" (click)="save()">
        <mat-icon>save</mat-icon>
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
