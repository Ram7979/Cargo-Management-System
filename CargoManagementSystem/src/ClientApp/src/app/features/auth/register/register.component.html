<div class="auth-container">
  <mat-card class="auth-card register-card">
    <div class="auth-header">
      <mat-icon color="primary" class="logo">flight_takeoff</mat-icon>
      <h2>Create an Account</h2>
      <p>Register to get started</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName" placeholder="First Name">
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName" placeholder="Last Name">
          </mat-form-field>
        </div>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="Email Address">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone Number (Optional)</mat-label>
        <input matInput formControlName="phone" type="tel" placeholder="Phone Number">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" placeholder="Password">
      </mat-form-field>

      <button mat-flat-button color="primary" class="full-width auth-btn" type="submit" [disabled]="registerForm.invalid || isLoading">
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
        <span *ngIf="!isLoading">Register</span>
      </button>

      <div class="auth-footer">
        <a routerLink="/auth/login">Already have an account? Login here.</a>
      </div>
    </form>
  </mat-card>
</div>
