<div class="page-header">
  <h2>Driver Management</h2>
  <div class="header-actions">
    <button mat-raised-button color="primary">
      <mat-icon>person_add</mat-icon> Register Driver
    </button>
  </div>
</div>

<div class="card-container">
  <table mat-table [dataSource]="dataSource" class="w-100">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Driver Name</th>
      <td mat-cell *matCellDef="let driver"> 
        <div class="driver-cell">
          <div class="avatar-bg">{{ driver.firstName[0] }}{{ driver.lastName[0] }}</div>
          <span>{{ driver.firstName }} {{ driver.lastName }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="license">
      <th mat-header-cell *matHeaderCellDef>License #</th>
      <td mat-cell *matCellDef="let driver"> {{ driver.licenseNumber }} </td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let driver"> {{ driver.phoneNumber }} </td>
    </ng-container>

    <ng-container matColumnDef="vehicle">
      <th mat-header-cell *matHeaderCellDef>Assigned Vehicle</th>
      <td mat-cell *matCellDef="let driver"> 
        <span *ngIf="driver.currentVehiclePlate" class="plate-tag">{{ driver.currentVehiclePlate }}</span>
        <span *ngIf="!driver.currentVehiclePlate" class="muted">None</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let driver">
        <app-status-chip [status]="driver.status"></app-status-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let driver">
        <button mat-icon-button color="primary" [matMenuTriggerFor]="driverMenu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #driverMenu="matMenu">
          <button mat-menu-item (click)="toggleStatus(driver)">
            <mat-icon>{{ driver.status === 'Active' ? 'event_busy' : 'check_circle' }}</mat-icon>
            <span>Set {{ driver.status === 'Active' ? 'On Leave' : 'Active' }}</span>
          </button>
          <button mat-menu-item>
            <mat-icon>directions_car</mat-icon>
            <span>Assign Vehicle</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="dataSource.length" [pageSize]="10"></mat-paginator>
</div>
