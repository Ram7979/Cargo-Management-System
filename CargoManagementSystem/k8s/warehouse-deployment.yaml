apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warehouse-service
  template:
    metadata:
      labels:
        app: warehouse-service
    spec:
      containers:
        - name: warehouse-service
          image: cms/warehouse-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cms-config
            - secretRef:
                name: cms-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-service
  namespace: default
spec:
  selector:
    app: warehouse-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
